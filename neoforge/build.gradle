plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev'
}

def root = rootProject
def modId = root.property('mod_id')
def apiLayer = root.api_layer

base {
    archivesName = "${modId}-neoforge"
}

sourceSets.main.java.srcDir root.file('common/src/main/java')
sourceSets.main.java.srcDir root.file("common/src/${apiLayer}/java")
sourceSets.main.resources.srcDir root.file('common/src/main/resources')
sourceSets.main.resources.srcDir root.file("common/src/${apiLayer}/resources")
sourceSets.test.java.srcDir root.file('common/src/test/java')
if (apiLayer != 'v121') {
    sourceSets.test.java.exclude('**/KeepMySwordConfigScreenTest.java')
}
sourceSets.test.compileClasspath += sourceSets.main.compileClasspath
sourceSets.test.runtimeClasspath += sourceSets.main.runtimeClasspath

if (apiLayer == 'v121') {
    sourceSets {
        gametest {
            compileClasspath += configurations.compileClasspath
            runtimeClasspath += configurations.runtimeClasspath
        }
    }
}
sourceSets.main.resources.srcDir tasks.register('generateModMetadata', ProcessResources) {
    def replaceProperties = [
        minecraft_version_range: root.minecraft_version_range,
        neo_version_range      : root.neo_version_range,
        loader_version_range   : root.property('loader_version_range'),
        mod_id                 : modId,
        mod_name               : root.property('mod_name'),
        mod_license            : root.property('mod_license'),
        mod_version            : root.property('mod_version'),
        mod_authors            : root.property('mod_authors'),
        mod_description        : root.property('mod_description'),
        icon_property          : root.minecraft_version == '26.2' ? 'iconFile' : 'logoFile'
    ]
    inputs.properties replaceProperties
    filteringCharset = 'UTF-8'
    expand replaceProperties
    from 'src/main/templates'
    into layout.buildDirectory.dir('generated/sources/modMetadata')
}

neoForge {
    version = root.neo_version
    mods {
        "${modId}" {
            sourceSet(sourceSets.main)
        }
        if (apiLayer == 'v121') {
            keep_my_sword_e2e {
                sourceSet(sourceSets.gametest)
            }
        }
    }
    unitTest {
        enable()
        testedMod = mods."${modId}"
    }
    runs {
        client { client() }
        server {
            server()
            programArgument '--nogui'
        }
        if (apiLayer == 'v121') {
            gameTestServer {
                type = 'gameTestServer'
                loadedMods = [mods.keep_my_sword_e2e]
                systemProperty 'neoforge.enabledGameTestNamespaces', 'keep_my_sword_e2e'
                gameDirectory = layout.buildDirectory.dir('run-gametest-e2e')
            }
        }
        configureEach {
            logLevel = org.slf4j.event.Level.INFO
        }
    }
}

neoForge.ideSyncTask tasks.named('generateModMetadata')

dependencies {
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test', Test) {
    dependsOn tasks.named('jar')
    useJUnitPlatform()
    doFirst {
        systemProperty 'kms.jar', tasks.named('jar').get().archiveFile.get().asFile.absolutePath
        systemProperty 'kms.root', root.projectDir.absolutePath
        systemProperty 'kms.apiLayer', apiLayer
    }
}

if (apiLayer == 'v121') {
    def stagePackagedJarForE2E = tasks.register('stagePackagedJarForE2E') {
        dependsOn tasks.named('jar')
        doLast {
            def modsDir = layout.buildDirectory.dir('run-gametest-e2e/mods').get().asFile
            if (modsDir.exists()) {
                modsDir.listFiles()?.each { it.delete() }
            } else {
                modsDir.mkdirs()
            }
            def packagedJar = tasks.named('jar').get().archiveFile.get().asFile
            copy {
                from packagedJar
                into modsDir
            }
            logger.lifecycle("Staged packaged JAR for black-box E2E GameTest: ${packagedJar.name}")
        }
    }

    tasks.matching { it.name == 'runGameTestServer' }.configureEach {
        dependsOn stagePackagedJarForE2E
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId = "${modId}-neoforge"
            from components.java
        }
    }
}
