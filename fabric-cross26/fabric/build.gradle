plugins {
    alias libs.plugins.fabricLoom
    id 'java-library'
}
base.archivesName = 'keep-my-sword-fabric'
configurations {
    commonJava { canBeResolved = true }
    commonResources { canBeResolved = true }
}
dependencies {
    commonJava project(path: ':common', configuration: 'commonJava')
    commonResources project(path: ':common', configuration: 'commonResources')
    minecraft libs.minecraft
    implementation libs.fabricLoader
    implementation libs.fabricApi
    implementation files("${providers.gradleProperty('rinlibDir').get()}/rinlib-${rinlib_version}+${minecraft_version}-fabric.jar")
}
sourceSets.main.java.srcDir '../../fabric/src/main/java'
sourceSets.main.resources.srcDir '../../fabric/src/main/resources'
tasks.named('compileJava', JavaCompile) {
    dependsOn configurations.commonJava
    source configurations.commonJava
}
processResources {
    dependsOn configurations.commonResources
    from configurations.commonResources
    inputs.properties([
        mod_id: mod_id, mod_name: mod_name, mod_version: mod_version,
        mod_license: mod_license, mod_authors: mod_authors,
        mod_description: mod_description, minecraft_version: minecraft_version,
        fabric_loader_version: libs.versions.fabricLoader.get(), rinlib_version: rinlib_version
    ])
    filesMatching('fabric.mod.json') {
        expand(
            mod_id: mod_id, mod_name: mod_name, mod_version: mod_version,
            mod_license: mod_license, mod_authors: mod_authors,
            mod_description: mod_description, minecraft_version: minecraft_version,
            fabric_loader_version: libs.versions.fabricLoader.get(), rinlib_version: rinlib_version
        )
    }
}
loom { mixin { defaultRefmapName.set('keep_my_sword.refmap.json') } }
tasks.named('jar').configure { archiveFileName = 'keep_my_sword-fabric-0.1.3.jar' }
tasks.withType(JavaCompile).configureEach { options.release = java_version as int; options.encoding = 'UTF-8' }
tasks.withType(AbstractArchiveTask).configureEach { preserveFileTimestamps = false; reproducibleFileOrder = true }
java { toolchain.languageVersion = JavaLanguageVersion.of(java_version as int) }
