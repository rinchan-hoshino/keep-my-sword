allprojects {
    afterEvaluate { p ->
        if (p.plugins.hasPlugin('net.neoforged.moddev')) {
            def unloaded = Boolean.getBoolean('probe.unloaded')
            def base = new File(System.getProperty('probe.sources'))
            def probe = p.sourceSets.create('runtimeProbe') {
                java.srcDirs new File(base, unloaded ? 'unload/java' : 'common/java'), new File(base, unloaded ? 'unload-entry/java' : 'neoforge/java'),
                        new File(base, 'players-' + System.getProperty('probe.players') + '/java')
                if (!unloaded) java.srcDir new File(base, p.rootProject.minecraft_version == '26.2' ? 'client-26.2/java' : 'client-modern/java')
                resources.srcDir new File(base, unloaded ? 'unload/resources' : 'neoforge/resources')
                compileClasspath += p.sourceSets.main.compileClasspath
                if (!unloaded) compileClasspath += p.sourceSets.main.output
                runtimeClasspath = output + (p.sourceSets.main.runtimeClasspath - p.sourceSets.main.output)
                if (!unloaded) runtimeClasspath += p.sourceSets.main.output
            }
            p.neoForge.mods.create('kms_probe') { sourceSet(probe) }
            p.neoForge.runs.create('probeClient') {
                sourceSet = probe
                if (unloaded) loadedMods = [p.neoForge.mods.getByName('kms_probe')]
                client()
                gameDirectory = p.file(System.getProperty('probe.instance'))
            }
            p.neoForge.runs.create('probeServer') {
                sourceSet = probe
                if (unloaded) loadedMods = [p.neoForge.mods.getByName('kms_probe')]
                server()
                gameDirectory = p.file(System.getProperty('probe.instance'))
                programArgument '--nogui'
            }
        }
    }
}
