plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.minecraftforge.gradle'
    id 'org.spongepowered.mixin'
}

def root = rootProject

def modId = root.property('mod_id')

base {
    archivesName = "${modId}-forge"
}

sourceSets.main.java.srcDir root.file('common/src/main/java')
sourceSets.main.resources.srcDir root.file('common/src/main/resources')
sourceSets.main.resources.srcDir tasks.register('generateModMetadata', ProcessResources) {
    def replaceProperties = [
        minecraft_version_range: root.property('minecraft_version_range'),
        forge_version_range    : root.property('forge_version_range'),
        loader_version_range   : root.property('loader_version_range'),
        rinlib_version         : root.property('rinlib_version'),
        mod_id                 : modId,
        mod_name               : root.property('mod_name'),
        mod_license            : root.property('mod_license'),
        mod_version            : root.property('mod_version'),
        mod_authors            : root.property('mod_authors'),
        mod_description        : root.property('mod_description')
    ]
    inputs.properties replaceProperties
    filteringCharset = 'UTF-8'
    expand replaceProperties
    from 'src/main/templates'
    into layout.buildDirectory.dir('generated/sources/modMetadata')
}

minecraft {
    mappings channel: 'official', version: root.property('minecraft_version')

    runs {
        client {
            workingDirectory project.file('run/client')
            mods { "${modId}" { source sourceSets.main } }
        }
        server {
            workingDirectory project.file('run/server')
            mods { "${modId}" { source sourceSets.main } }
        }
    }
}

mixin {
    add sourceSets.main, "${modId}.refmap.json"
    config "${modId}.mixins.json"
    config "${modId}.forge.mixins.json"
}

jar {
    manifest.attributes([
        "MixinConfigs": "${modId}.mixins.json,${modId}.forge.mixins.json"
    ])
}

dependencies {
    minecraft "net.minecraftforge:forge:${root.property('minecraft_version')}-${root.property('forge_version')}"
    implementation fg.deobf("dev.rinchan:rinlib-forge:${root.property('rinlib_version')}")
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

jar.finalizedBy('reobfJar')

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId = "${modId}-forge"
            artifact jar
        }
    }
}
