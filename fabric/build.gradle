plugins {
    id 'java-library'
    id 'maven-publish'
}

def root = rootProject
def unobfuscated = root.minecraft_version.startsWith('26.')
apply plugin: unobfuscated ? 'net.fabricmc.fabric-loom' : 'fabric-loom'

loom.interfaceInjection.getIsEnabled().set(false)

def modId = root.property('mod_id')

base {
    archivesName = "${modId}-fabric"
}

sourceSets.main.java.srcDir root.file('common/src/main/java')
sourceSets.main.resources.srcDir root.file('common/src/main/resources')

if (!unobfuscated) loom {
    mixin {
        useLegacyMixinAp = true
        defaultRefmapName.set("${modId}.refmap.json")
    }
}

dependencies {
    def rinlib = "maven.modrinth:rinlib:${rootProject.rinlib_version}+${rootProject.minecraft_version}-fabric"
    if (rootProject.hasProperty('rinlibJar')) {
        def localJar = file(rootProject.property('rinlibJar'))
        repositories { flatDir { dirs localJar.parentFile } }
        rinlib = dependencies.create("dev.rinchan:rinlib-fabric:${rootProject.rinlib_version}+${rootProject.minecraft_version}") {
            artifact { name = localJar.name - '.jar'; type = 'jar'; extension = 'jar' }
        }
    }
    add(Boolean.getBoolean('probe.bundled') ? (unobfuscated ? 'compileOnly' : 'modCompileOnly') : (unobfuscated ? 'implementation' : 'modImplementation'), rinlib)
    include rinlib

    implementation 'com.electronwill.night-config:toml:3.8.3'
    include 'com.electronwill.night-config:core:3.8.3'
    include 'com.electronwill.night-config:toml:3.8.3'
    add(unobfuscated ? 'implementation' : 'modImplementation', "net.fabricmc.fabric-api:fabric-api:${root.fabric_api_version}")
    compileOnly "net.fabricmc:sponge-mixin:0.17.3+mixin.0.8.7"
    minecraft "com.mojang:minecraft:${root.property('minecraft_version')}"
    if (!unobfuscated) mappings loom.officialMojangMappings()
    add(unobfuscated ? 'implementation' : 'modImplementation', "net.fabricmc:fabric-loader:${root.property('fabric_loader_version')}")
}

def resourceProperties = [
    rinlib_version: root.property('rinlib_version'),
    mod_id: modId,
    mod_name: root.property('mod_name'),
    mod_version: root.property('mod_version'),
    mod_license: root.property('mod_license'),
    mod_authors: root.property('mod_authors'),
    mod_description: root.property('mod_description'),
    minecraft_version: root.property('minecraft_version'),
    java_version: root.java_version,
    fabric_loader_version: root.property('fabric_loader_version')
]

processResources {
    inputs.properties(resourceProperties)
    filesMatching('fabric.mod.json') {
        expand resourceProperties

    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId = "${modId}-fabric"
            from components.java
        }
    }
}
