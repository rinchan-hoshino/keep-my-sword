pluginManagement {
    repositories {
        mavenLocal()
        gradlePluginPortal()
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://maven.neoforged.net/releases' }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'keep-my-sword'
def selectedLoader = providers.gradleProperty('loader').getOrElse('all')
if (!(selectedLoader in ['all', 'fabric', 'neoforge'])) throw new GradleException("Unsupported loader: ${selectedLoader}")
if (selectedLoader in ['all', 'fabric']) include 'fabric'
if (selectedLoader in ['all', 'neoforge']) include 'neoforge'
