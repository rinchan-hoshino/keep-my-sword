allprojects {
    afterEvaluate { p ->
        if (p.plugins.hasPlugin('net.neoforged.moddev')) {
            def base = new File(System.getProperty('probe.sources'))
            def probe = p.sourceSets.create('runtimeProbe') {
                java.srcDirs new File(base, 'common/java'), new File(base, 'neoforge/java'),
                        new File(base, 'players-' + System.getProperty('probe.players') + '/java')
                java.srcDir new File(base, p.rootProject.minecraft_version == '26.2' ? 'client-26.2/java' : 'client-modern/java')
                resources.srcDir new File(base, 'neoforge/resources')
                compileClasspath += p.sourceSets.main.output + p.sourceSets.main.compileClasspath
                runtimeClasspath += output + p.sourceSets.main.output + p.sourceSets.main.runtimeClasspath
            }
            p.neoForge.mods.create('kms_probe') { sourceSet(probe) }
            p.neoForge.runs.create('probeClient') {
                client()
                gameDirectory = p.file(System.getProperty('probe.instance'))
            }
            p.neoForge.runs.create('probeServer') {
                server()
                gameDirectory = p.file(System.getProperty('probe.instance'))
                programArgument '--nogui'
            }
        }
    }
}
