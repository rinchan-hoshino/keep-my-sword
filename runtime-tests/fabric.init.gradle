allprojects {
    afterEvaluate { p ->
        if (p.plugins.hasPlugin('fabric-loom') || p.plugins.hasPlugin('net.fabricmc.fabric-loom')) {
            def unloaded = Boolean.getBoolean('probe.unloaded')
            def base = new File(System.getProperty('probe.sources'))
            p.dependencies.add(p.rootProject.minecraft_version.startsWith('26.') ? 'implementation' : 'modImplementation',
                    "net.fabricmc.fabric-api:fabric-api:${System.getProperty('probe.fabricApi')}")
            def probe = p.sourceSets.create('runtimeProbe') {
                java.srcDirs new File(base, unloaded ? 'unload/java' : 'common/java'), new File(base, unloaded ? 'unload-entry/java' : 'fabric/java'), new File(base, 'players-modern/java')
                if (!unloaded) java.srcDir new File(base, 'client-modern/java')
                resources.srcDir new File(base, unloaded ? 'unload/resources' : 'fabric/resources')
                compileClasspath += p.sourceSets.main.compileClasspath
                if (!unloaded) compileClasspath += p.sourceSets.main.output
                runtimeClasspath = output + (p.sourceSets.main.runtimeClasspath - p.sourceSets.main.output)
                if (!unloaded) runtimeClasspath += p.sourceSets.main.output
            }
            p.loom.mods {
                if (!unloaded) keep_my_sword { sourceSet(p.sourceSets.main) }
                kms_probe { sourceSet(probe) }
            }
            ['server', 'client'].each { side ->
                p.tasks.named('run' + side.capitalize()).configure {
                    doFirst { workingDir = p.file(System.getProperty('probe.instance')) }
                }
                p.loom.runs.named(side) {
                    source(probe)
                    runDir(p.projectDir.toPath().relativize(p.file(System.getProperty('probe.instance')).toPath()).toString())
                }
            }
        }
    }
}
