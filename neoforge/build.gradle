plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev.legacyforge'
}

def root = rootProject

def modId = root.property('mod_id')

base {
    archivesName = "${modId}-neoforge"
}

sourceSets.main.java.srcDir root.file('common/src/main/java')
sourceSets.main.resources.srcDir root.file('common/src/main/resources')
sourceSets.main.resources.srcDir tasks.register('generateModMetadata', ProcessResources) {
    def replaceProperties = [
        minecraft_version_range: root.property('minecraft_version_range'),
        neo_version_range      : root.property('neo_version_range'),
        loader_version_range   : root.property('loader_version_range'),
        rinlib_version         : root.property('rinlib_version'),
        mod_id                 : modId,
        mod_name               : root.property('mod_name'),
        mod_license            : root.property('mod_license'),
        mod_version            : root.property('mod_version'),
        mod_authors            : root.property('mod_authors'),
        mod_description        : root.property('mod_description')
    ]
    inputs.properties replaceProperties
    filteringCharset = 'UTF-8'
    expand replaceProperties
    from 'src/main/templates'
    into layout.buildDirectory.dir('generated/sources/modMetadata')
}

legacyForge {
    enable {
        neoForgeVersion = "${root.property('minecraft_version')}-${root.property('neo_version')}"
    }
    mods {
        "${modId}" {
            sourceSet(sourceSets.main)
        }
    }
}

legacyForge.ideSyncTask tasks.named('generateModMetadata')

mixin {
    add sourceSets.main, "${modId}.refmap.json"
    config "${modId}.mixins.json"
    config "${modId}.client.mixins.json"
}

jar {
    manifest.attributes([
        "MixinConfigs": "${modId}.mixins.json,${modId}.client.mixins.json"
    ])
}

dependencies {
    implementation "dev.rinchan:rinlib-neoforge:${root.property('rinlib_version')}"
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId = "${modId}-neoforge"
            from components.java
        }
    }
}
