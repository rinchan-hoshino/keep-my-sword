plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev'
}

base {
    archivesName = "${rootProject.mod_id}-neoforge"
}

sourceSets.main.java.srcDir rootProject.file('common/src/main/java')
sourceSets.main.java.srcDir rootProject.file('adapters/' + rootProject.source_adapter)
sourceSets.main.java.srcDir rootProject.file('adapters/' + rootProject.source_adapter + '-neoforge')
sourceSets.main.resources.srcDir rootProject.file('common/src/main/resources')
sourceSets.test.java.srcDir rootProject.file('common/src/test/java')
sourceSets.test.compileClasspath += sourceSets.main.compileClasspath
sourceSets.test.runtimeClasspath += sourceSets.main.runtimeClasspath
sourceSets.main.resources.srcDir tasks.register('generateModMetadata', ProcessResources) {
    def replaceProperties = [
        minecraft_version_range: rootProject.minecraft_version_range,
        neo_version_range      : rootProject.neo_version_range,
        loader_version_range   : rootProject.loader_version_range,
        rinlib_version         : rootProject.rinlib_version,
        mod_id                 : rootProject.mod_id,
        mod_name               : rootProject.mod_name,
        mod_license            : rootProject.mod_license,
        mod_version            : rootProject.mod_version,
        mod_authors            : rootProject.mod_authors,
        mod_description        : rootProject.mod_description,
        extra_mixins           : '',
        icon_property          : rootProject.minecraft_version == '26.2' ? 'iconFile' : 'logoFile'
    ]
    inputs.properties replaceProperties
    filteringCharset = 'UTF-8'
    expand replaceProperties
    from 'src/main/templates'
    into layout.buildDirectory.dir('generated/sources/modMetadata')
}

neoForge {
    version = rootProject.neo_version
    mods {
        "${rootProject.mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
    unitTest {
        enable()
        testedMod = mods."${rootProject.mod_id}"
    }
    runs {
        client { client() }
        server {
            server()
            programArgument '--nogui'
        }
        configureEach {
            logLevel = org.slf4j.event.Level.INFO
        }
    }
}

neoForge.ideSyncTask tasks.named('generateModMetadata')

dependencies {
    implementation 'com.electronwill.night-config:toml:3.8.3'
    def rinlibArtifact = providers.gradleProperty('rinlibJar').orElse(
            providers.gradleProperty('rinlibDir').map { directory ->
                rootProject.file(directory + '/rinlib-' + rootProject.rinlib_version + '+' + rootProject.minecraft_version + '-neoforge.jar').path
            })
    implementation files(rinlibArtifact)
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.mockito:mockito-core:5.14.2'
    testImplementation 'net.bytebuddy:byte-buddy:1.17.8'
    testImplementation 'net.bytebuddy:byte-buddy-agent:1.17.8'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test', Test) {
    useJUnitPlatform()
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId = "${rootProject.mod_id}-neoforge"
            from components.java
        }
    }
}
