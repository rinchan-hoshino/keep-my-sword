plugins {
    id 'java-library'
    id 'fabric-loom' version '1.17-SNAPSHOT'
}
group = 'dev.rinchan'
version = mod_version
base.archivesName = 'keep_my_sword-fabric'
repositories {
    mavenCentral()
    maven { url = 'https://maven.fabricmc.net/' }
}
sourceSets.main.java.srcDirs '../common/src/main/java', '../fabric/src/main/java'
sourceSets.main.resources.srcDirs '../common/src/main/resources', '../fabric/src/main/resources'
sourceSets.test.java.srcDir '../common/src/test/java'
dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings files('identity-mappings.jar')
    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    compileOnly "net.fabricmc:sponge-mixin:0.17.3+mixin.0.8.7"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    implementation files("${providers.gradleProperty('rinlibDir').get()}/rinlib-${rinlib_version}+${minecraft_version}-fabric.jar")
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(Test).configureEach { useJUnitPlatform() }
def resourceProperties = [
    mod_id: mod_id, mod_name: mod_name, mod_version: mod_version,
    mod_license: mod_license, mod_authors: mod_authors,
    mod_description: mod_description, minecraft_version: minecraft_version,
    fabric_loader_version: fabric_loader_version, rinlib_version: rinlib_version
]
processResources {
    inputs.properties(resourceProperties)
    filesMatching('fabric.mod.json') { expand resourceProperties }
}
tasks.named('jar').configure { archiveFileName = 'keep_my_sword-fabric-0.1.3.jar' }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release = java_version as int }
tasks.withType(AbstractArchiveTask).configureEach { preserveFileTimestamps = false; reproducibleFileOrder = true }
java { toolchain.languageVersion = JavaLanguageVersion.of(java_version as int) }
